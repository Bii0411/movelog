<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<title>moti · 수익화 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0b0b0f;--surface:#16161c;--surface2:#1e1e26;--line:#2a2a34;
  --text:#f3f1f7;--sub:#9b98a8;--dim:#5d5a6a;
  --accent:#8b5cf6;--accent2:#b49cff;--step:#34d399;--jump:#a78bfa;
  --gold:#f5c04e;--hot:#ff3d7f;
  --S:#ffcf4a;--A:#ff6b9a;--B:#a78bfa;--C:#5eb8ff;--D:#4fd1a5;--E:#9aa3b5;--F:#6b6f7c;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#000}
body{margin:0;background:#000;color:var(--text);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.app{max-width:440px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:84px}
/* top */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:8px;padding:14px 18px 10px}
.top .seg{display:flex;gap:14px;margin-right:auto}
.top .seg button{font-size:22px;font-weight:900;color:var(--dim)}
.top .seg button.on{color:var(--text)}
.top h1{margin:0 auto 0 0;font-size:22px;font-weight:900}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:17px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:14px}
.dot{width:8px;height:8px;border-radius:50%}
.dot.s{background:var(--step)}.dot.j{background:var(--jump)}
.plusbtn{height:38px;padding:0 16px;border-radius:10px;background:var(--accent);font-weight:900;color:#fff}
.plusbtn.on{background:var(--surface2);color:var(--gold);border:1px solid var(--gold)}
.view{padding:4px 16px 24px}
/* nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;z-index:30;background:#101015;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--dim)}
.nav button .i{font-size:20px;line-height:24px}
.nav button.on{color:var(--text);font-weight:700}
/* banner */
.banner{position:relative;height:200px;border-radius:18px;overflow:hidden;margin-bottom:16px;cursor:pointer}
.banner .slide{position:absolute;inset:0;display:flex;align-items:flex-end;padding:22px;opacity:0;transition:opacity .4s}
.banner .slide.on{opacity:1}
.banner .slide .art{position:absolute;right:0;top:0;bottom:0;width:58%;background-size:cover;background-position:center 20%}
.banner .slide .art::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--bgc) 0%,transparent 55%)}
.banner .tx{position:relative;max-width:62%}
.banner small{display:block;font-weight:700;color:#d8d3e6;font-size:13px;margin-bottom:6px}
.banner b{display:block;font-size:21px;line-height:1.3;font-weight:900}
.banner em{display:block;font-style:normal;color:var(--hot);font-weight:700;font-size:13px;margin-top:6px}
.banner .cnt{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.55);border-radius:10px;padding:2px 9px;font-size:12px}
/* sections */
.sec{margin:26px 0 12px;display:flex;align-items:baseline;justify-content:space-between}
.sec h2{margin:0;font-size:18px;font-weight:900}
.sec span{color:var(--sub);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ccard{border-radius:18px;overflow:hidden;background:var(--surface);text-align:left;display:flex;flex-direction:column}
.ccard .pic{aspect-ratio:262/300;background-size:cover;background-position:center 15%;position:relative}
.ccard .pic::after{content:"";position:absolute;inset:auto 0 0;height:40%;background:linear-gradient(transparent,var(--surface))}
.pill{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.6);border-radius:12px;padding:2px 10px;font-size:12px;font-weight:700;z-index:1}
.pill.r{left:auto;right:10px;background:var(--hot)}
.ccard .bd{padding:4px 12px 14px}
.ccard h3{margin:0 0 4px;font-size:15px;font-weight:900;line-height:1.35}
.ccard p{margin:0 0 6px;color:var(--sub);font-size:13px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{color:var(--dim);font-size:12px}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.route{flex:0 0 220px;border-radius:16px;padding:14px;background:var(--surface);border:1px solid var(--line);text-align:left;position:relative;overflow:hidden}
.route .av{width:44px;height:44px;border-radius:12px;background-size:cover;background-position:center 15%;margin-bottom:10px}
.route b{display:block;font-size:15px}
.route span{font-size:12px;color:var(--sub)}
.route .k{position:absolute;top:12px;right:12px;font-size:11px;font-weight:700;color:var(--accent2);border:1px solid var(--accent);border-radius:8px;padding:1px 7px}
.ep{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--surface);margin-bottom:8px;width:100%;text-align:left}
.ep .av{width:52px;height:52px;border-radius:12px;flex:0 0 52px;background-size:cover;background-position:center 15%}
.ep .m{flex:1;min-width:0}
.ep b{display:block;font-size:15px}
.ep span{display:block;font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price{font-size:12px;font-weight:700;white-space:nowrap;text-align:right}
.price .s{color:var(--step)}.price .j{color:var(--jump)}
.tagbox{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-top:4px}
.tg-pack{background:#2b2240;color:var(--accent2)}
.tg-own{background:#173328;color:var(--step)}
.tg-lock{background:#33202a;color:#ff9fbf}
.ad{margin:18px 0;border:1px dashed var(--line);border-radius:14px;padding:16px;text-align:center;color:var(--dim);font-size:12px}
/* rank */
.rank{display:flex;gap:14px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.rank .n{width:24px;font-size:20px;font-weight:900;color:var(--accent2);text-align:center}
.rank .av{width:56px;height:56px;border-radius:14px;background-size:cover;background-position:center 15%}
/* discover */
.search{display:flex;gap:8px;margin-bottom:12px}
.srow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px;padding-bottom:2px}.srow::-webkit-scrollbar{display:none}
.srow>button{flex:0 0 auto}
.pillchip{height:38px;padding:0 16px;border-radius:19px;border:1px solid var(--line);font-size:14px;color:var(--text)}
.pillchip.on{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:700}
.srow.tagrow{flex-wrap:wrap;overflow:visible;margin-bottom:14px}
.cpk{flex:0 0 250px;display:flex;gap:10px;align-items:center;text-align:left;padding:12px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.cpk .av{width:54px;height:54px;border-radius:12px;background-size:cover;background-position:center 15%;flex:0 0 54px}
.cpk .k{display:block;font-size:11px;color:var(--gold,#f5c451)}.cpk b{display:block;font-size:15px}.cpk span:last-child{font-size:12px;color:var(--sub)}
.modebar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 2px 0;font-size:13px;color:var(--sub)}
.modebar .who b{color:var(--text);font-size:14px}.modebar .hs{color:#ff6b9a;letter-spacing:-1px}
.mseg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:2px;flex:none}
.mseg button{height:28px;padding:0 10px;border-radius:14px;font-size:12px;color:var(--sub)}
.mseg button.on{background:var(--accent);color:#fff;font-weight:700}
.choice{align-self:stretch;background:var(--surface);border:1px dashed var(--accent);border-radius:16px;padding:10px 12px}
.choice b{font-size:13px}.choice .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.choice .opts button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-size:12.5px;font-weight:700;text-align:center}
.choice .opts small{font-size:11px;font-weight:400;color:var(--sub)}.choice .opts small.own{color:var(--step)}
.choice .gb,.mkrow .gb{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;font-size:11px;color:#111;font-weight:900}
.maker{border-radius:16px;background:var(--surface);border:1px solid var(--line);padding:14px;margin-bottom:10px}
.maker h3{margin:0 0 4px;font-size:16px}.maker .sub{margin:0 0 10px}
.mklist{display:flex;flex-direction:column;gap:6px;max-height:330px;overflow-y:auto;margin-bottom:10px}
.mkrow{display:flex;align-items:center;gap:8px;padding:8px;border-radius:12px;background:var(--surface2);border:1px solid transparent}
.mkrow.on{border-color:var(--accent)}
.mkrow .pv{width:32px;height:32px;border-radius:16px;border:1px solid var(--line);flex:none}
.mkrow .nm{flex:1;min-width:0}.mkrow .nm b{font-size:14px;display:block}.mkrow .nm small{font-size:11.5px;color:var(--sub)}
.mkrow .cost{font-size:12px;color:var(--sub);white-space:nowrap}
.mkrow .add{width:32px;height:32px;border-radius:16px;background:var(--accent);color:#fff;font-weight:900;flex:none}
.mkrow:not(.on) .add{background:transparent;border:1px solid var(--accent);color:var(--accent)}
.mkbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:10px;border-top:1px solid var(--line)}
.mkbar b{font-size:14px;display:block}.mkbar small{font-size:12px;color:var(--sub)}.mkbar s{color:var(--dim)}
.search input{flex:1;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:0 14px;font:inherit}
.fchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.fchip{height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);font-size:13px;color:var(--sub)}
.fchip.on{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:700}
.wide{display:flex;gap:10px;margin-top:16px}
.btn{height:46px;border-radius:12px;padding:0 16px;font-weight:700;background:var(--surface2);border:1px solid var(--line);flex:1}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1a1405}
.btn:disabled{opacity:.4;cursor:not-allowed}
/* chat */
.chatwrap.conly{position:relative;isolation:isolate}
.chatwrap.conly::before{content:"";position:absolute;inset:-8px -16px;z-index:-1;background:linear-gradient(rgba(11,11,16,.72),rgba(11,11,16,.86)),var(--scn,none) center/cover no-repeat;border-radius:0}
.cohd{display:flex;align-items:center;gap:8px;padding:6px 2px}.cohd b{font-size:17px}.cohd span{flex:1;font-size:12.5px;color:var(--sub)}
.conly .msg.c{background:rgba(40,38,52,.82);backdrop-filter:blur(4px)}
.mgrp{display:flex;align-items:center;gap:6px}
.kbar{display:inline-block;width:88px;height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.kbar i{display:block;height:100%;background:linear-gradient(90deg,#8b5cf6,#ff6b9a);transition:width .6s}
.kmo{position:absolute;left:50%;top:18%;transform:translateX(-50%);z-index:4;font-weight:900;font-size:18px;color:#fff;padding:8px 18px;border-radius:99px;background:linear-gradient(90deg,rgba(139,92,246,.85),rgba(255,107,154,.85));box-shadow:0 0 30px rgba(255,107,154,.5);white-space:nowrap;animation:kmo 3.2s ease forwards;pointer-events:none}
@keyframes kmo{0%{opacity:0;transform:translate(-50%,10px)}12%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}
.mfull .fline{position:absolute;left:16px;right:16px;bottom:56px;z-index:4;text-align:center;font-size:16px;line-height:1.5;color:#fff;background:rgba(10,8,18,.62);border-radius:14px;padding:12px 14px;backdrop-filter:blur(4px)}
.mfull .fchoice{position:absolute;left:12px;right:12px;bottom:52px;z-index:4}
.mfull .fchoice .choice{background:rgba(20,18,30,.82);backdrop-filter:blur(6px)}.mgrp small{font-size:11.5px;color:var(--sub)}
.modebar{flex-wrap:wrap;row-gap:6px}
.mfull{position:fixed;inset:0;z-index:60;background:rgba(5,4,10,.9);display:flex;align-items:center;justify-content:center;animation:mfin .3s ease}
.mfull.out{opacity:0;transition:opacity .35s}
.mfull .stage3d{width:min(100%,560px);height:min(100vh,860px);border-radius:0}
.mfull .mclose{position:absolute;top:16px;right:16px;z-index:5}
@keyframes mfin{from{opacity:0}to{opacity:1}}
.room3d{margin-bottom:14px}
.room3d .stage3d{height:min(52vh,420px)}
.room3d .rinfo{padding:10px 4px 0}.room3d .rinfo b{display:block;font-size:16px;margin:2px 0}.room3d .rinfo p{margin:0;font-size:13px;color:var(--sub)}
.room3d .now{font-size:12.5px;color:var(--sub)}
.charbar .b3{margin-left:4px;font-size:10px;font-weight:900;color:#fff;background:var(--accent);border-radius:6px;padding:1px 5px}
.chatwrap{display:flex;flex-direction:column;height:calc(100vh - 150px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.stage{display:flex;gap:14px;align-items:center;padding:12px;background:var(--surface);border-radius:16px}
.stage .figure{width:86px;height:104px;border-radius:14px;background-size:cover;background-position:center 15%;flex:0 0 86px;position:relative}
.stage .info{flex:1;min-width:0}
.soon3{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);white-space:nowrap;font-size:10.5px;font-weight:700;color:#e8e2f2;background:rgba(10,8,16,.72);border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:1px 6px;pointer-events:none}
.stage b{font-size:17px}
.gauge{font-size:15px;letter-spacing:2px;color:var(--hot);margin-top:2px}
.gauge+small,.mood{display:block;font-size:12px;color:var(--sub)}
.msgs{flex:1;overflow-y:auto;padding:14px 2px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:80%;padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.55}
.msg.c{background:var(--surface2);border-top-left-radius:4px;align-self:flex-start}
.msg.u{background:var(--accent);color:#fff;border-top-right-radius:4px;align-self:flex-end}
.msg.sys{align-self:center;background:none;color:var(--sub);font-size:12px;padding:2px}
.msg .act{display:block;font-size:12px;color:var(--accent2);margin-bottom:2px}
.composer{display:flex;gap:6px;padding-top:8px}
.composer input{flex:1;height:46px;border-radius:23px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:0 16px;font:inherit}
.composer .ic{width:46px;height:46px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);font-size:18px}
.composer .send{background:var(--accent);border-color:var(--accent)}
.toolrow{display:flex;gap:6px;padding-top:8px;overflow-x:auto;scrollbar-width:none}.toolrow::-webkit-scrollbar{display:none}.toolrow button{flex:none;white-space:nowrap}
.toolrow button{height:34px;padding:0 12px;border-radius:17px;background:var(--surface);border:1px solid var(--line);font-size:13px}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dmhd{display:flex;align-items:baseline;justify-content:space-between;margin:6px 0 6px}.dmhd h2{margin:0;font-size:18px}.dmhd span{font-size:12.5px;color:var(--sub)}
.dmlist{display:flex;flex-direction:column}
.dm{display:flex;align-items:center;gap:12px;padding:10px 4px;text-align:left;border-radius:14px}
.dm:hover{background:var(--surface)}
.dm .av{position:relative;width:54px;height:54px;border-radius:20px;background-size:cover;background-position:center 15%;flex:none}
.dm .d3{position:absolute;right:-4px;bottom:-4px;font-style:normal;font-size:9.5px;font-weight:900;color:#fff;background:var(--accent);border:2px solid var(--bg);border-radius:7px;padding:0 4px}
.dm .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}.dm .mid b{font-size:15px}
.dm .pv{font-size:13.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dm .rt{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}.dm .rt small{font-size:11.5px;color:var(--dim,#8a8796)}
.ub{font-style:normal;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#ff4d6d;color:#fff;font-size:11.5px;font-weight:900;display:grid;place-items:center}
#nav .i{position:relative}
.nub{position:absolute;top:-6px;right:-14px;font-style:normal;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:#ff4d6d;color:#fff;font-size:10px;font-weight:900;display:grid;place-items:center;line-height:1}
.pick button{background:var(--surface);border-radius:16px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:700}
.pick .av{width:72px;height:72px;border-radius:50%;background-size:cover;background-position:center 15%}
/* fitting room */
.charbar{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}
.charbar button{flex:0 0 auto;display:flex;align-items:center;gap:6px;height:38px;padding:0 12px 0 4px;border-radius:19px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:700}
.charbar button .av{width:30px;height:30px;border-radius:50%;background-size:cover;background-position:center 15%}
.charbar button.on{border-color:var(--accent2);background:#221a38}
.room{display:flex;gap:14px;align-items:center;padding:14px;border-radius:18px;background:radial-gradient(120% 90% at 20% 30%,#2a1f45,var(--surface) 70%);margin-bottom:14px}
.room .figure{width:110px;height:136px;border-radius:16px;background-size:cover;background-position:center 15%;flex:0 0 110px;position:relative}
.room .now{font-size:12px;color:var(--sub)}
.room b{display:block;font-size:17px;margin:2px 0 6px}
.room p{margin:0;font-size:13px;color:var(--sub)}
.boxcard{border-radius:18px;padding:16px;background:linear-gradient(135deg,#2d1d0b,#1b1420 60%);border:1px solid #5a4210;margin-bottom:14px}
.boxcard h3{margin:0;font-size:17px;font-weight:900;color:var(--gold)}
.boxcard p{margin:4px 0 10px;font-size:13px;color:#cfc4ad}
.ptable{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:12px}
.ptable th,.ptable td{text-align:center;padding:4px 0;border-bottom:1px solid #3a2e1a}
.ptable th:first-child,.ptable td:first-child{text-align:left;color:#cfc4ad;font-weight:500}
.boxbtns{display:flex;gap:8px}
.tabs{display:flex;gap:4px;background:var(--surface);border-radius:12px;padding:4px;margin-bottom:12px}
.tabs button{flex:1;height:36px;border-radius:9px;font-size:14px;font-weight:700;color:var(--sub)}
.tabs button.on{background:var(--surface2);color:var(--text)}
.mlist{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcard{border-radius:14px;background:var(--surface);border:1px solid var(--line);padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;position:relative}
.mcard.no{opacity:.55}
.mcard.no:hover{opacity:.8}
.mcard .row{display:flex;gap:6px;align-items:center}
.gb{width:24px;height:24px;border-radius:7px;font-weight:900;font-size:13px;display:grid;place-items:center;color:#111}
.mcard b{font-size:14px}
.mcard .emo{font-size:12px;color:var(--sub)}
.lab{font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;display:inline-block}
.lab.st{background:#173328;color:var(--step)}
.lab.jp{background:#2b2240;color:var(--jump)}

.gcard .b b{font-size:16px}
.gcard .b span{font-size:12px;color:var(--sub)}
/* motion anims */
.figure.a-nod{animation:nod .5s ease-in-out 3}
.figure.a-pulse{animation:pulse .6s ease-in-out 3}
.figure.a-bounce{animation:bounce .45s ease-out 3}
.figure.a-sink{animation:sink 1.6s ease-in-out}
.figure.a-lean{animation:lean 1.2s ease-in-out}
.figure.a-shake{animation:shake .35s linear 4}
.figure.a-tilt{animation:tilt 1.4s ease-in-out}
.figure.a-turn{animation:turn 1.6s ease-in-out}
.figure.a-zoom{animation:zoom 1.6s ease-in-out}
.figure.a-sway{animation:sway .6s ease-in-out 3}
.figure.a-flash{animation:flash 1.2s}
.figure.a-punch{animation:punch .32s ease-out 4}
.figure.a-heart{animation:pulse .5s ease-in-out 4}
.figure.a-dance{animation:dance 1.8s ease-in-out}
@keyframes nod{50%{transform:translateY(6px) rotate(2deg)}}
@keyframes pulse{50%{transform:scale(1.06)}}
@keyframes bounce{40%{transform:translateY(-14px)}}
@keyframes sink{50%{transform:translateY(8px) scale(.97);filter:brightness(.7)}}
@keyframes lean{50%{transform:translateX(10px) rotate(4deg)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes tilt{30%,70%{transform:rotate(-6deg)}}
@keyframes turn{30%,70%{transform:scaleX(-1)}}
@keyframes zoom{40%,70%{transform:scale(1.14)}}
@keyframes sway{25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
@keyframes flash{20%{filter:brightness(2.2)}40%{filter:brightness(1)}60%{filter:brightness(2)}}
@keyframes punch{50%{transform:translateX(16px) scale(1.04)}}
@keyframes dance{20%{transform:translateX(-10px) rotate(-6deg)}40%{transform:translateX(10px) rotate(6deg) translateY(-6px)}60%{transform:translateX(-8px) rotate(-4deg)}80%{transform:translateX(8px) rotate(4deg) translateY(-4px)}}
.fx{position:absolute;left:50%;bottom:10%;transform:translateX(-50%);font-size:26px;pointer-events:none;animation:fx 1.8s ease-out forwards}

function chatMeta(c){
  const msgs=S.chats[c.id];
  if(!msgs||!msgs.length)return{last:c.intro,time:Date.now()-FIRST_MIN[c.id]*60000,unread:1};
  const lastM=[...msgs].reverse().find(m=>m.r==="c"||m.r==="u")||msgs[msgs.length-1];
  const unread=msgs.slice(S.read[c.id]||0).filter(m=>m.r==="c").length;
  return{last:(lastM.r==="u"?"나: ":"")+lastM.t,time:S.last[c.id]||Date.now()-FIRST_MIN[c.id]*60000,unread};
}

const KEYMOMENT=/좋아|사랑|보고 싶|보고싶|고마|미안|고백|약속|비밀|울지|울어|안아|기다렸|지켜|손 잡|손잡|설레|두근/;

function choicePick(cid){
  const sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
  const own=sh(M.filter(m=>m.tier!=="T0"&&owns(cid,m.id))),base=sh(M.filter(m=>m.tier==="T0")),no=sh(M.filter(m=>!owns(cid,m.id)));
  const out=[...own,...base].slice(0,no.length?2:3);if(no.length)out.push(no[0]);return out.map(m=>m.id);
}
function choiceHtml(c,m,i){

  return `<div class="choice"><b>${c.name}의 어떤 반응을 볼까요?</b><div class="opts">${m.ms.map(id=>{const x=mBy(id),own=owns(c.id,id);

    return `<button data-act="pickm" data-v="${id}" data-i="${i}"><span class="gb" style="background:var(--${x.grade})">${x.grade}</span>${x.name}<small class="${own?"own":""}">${own?"✓ ":""}${lab}</small></button>`}).join("")}</div></div>`;
}
function send(){
  const i=$("#ci");const t=i.value.trim();if(!t)return;const c=chById(U.chatChar);const b=bond(c.id);
  S.chats[c.id].push({r:"u",t});S.last[c.id]=Date.now();
  const lv0=Math.min(5,Math.floor(b.pts/4));
  b.turns++;b.pts+=1+(KEYMOMENT.test(t)?2:0);b.mood=Math.min(2,Math.floor(Math.random()*3));
  const owned=M.filter(m=>owns(c.id,m.id));let pick=owned[Math.floor(Math.random()*owned.length)];
  // 장소 말이 나오면 배경 바꾸기
  const L=SCENES[c.id];let moved=null;
  if(L){const sm=S.scene||(S.scene={});const cur=sm[c.id]||0;const k=L.findIndex(x=>x.kw.test(t));
    if(k>=0&&k!==cur){U.sceneFrom={cid:c.id,img:L[cur].img};sm[c.id]=k;moved=L[k];S.chats[c.id].push({r:"sys",t:`📍 장소가 바뀌었어요 · ${moved.name}`})}}
  // 결정적 순간: 대화가 쌓여 게이지가 100을 넘으면 자동으로 (무료, 구매 유도 없음)
  //  턴 +15, 20자 이상 +10, 마음이 담긴 말 +35, 장소 이동 +25 (실제 앱에선 AI가 대화 맥락으로 판단)
  const g=(S.gauge[c.id]||0)+15+(t.length>=20?10:0)+(KEYMOMENT.test(t)?35:0)+(moved?25:0);
  const key=g>=100&&b.turns>=2;S.gauge[c.id]=key?0:Math.min(95,g);
  const line=moved?moved.say:c.lines[(b.turns-1)%c.lines.length];
  if(key){pick=owned.slice().sort((x,y)=>GRADES.indexOf(x.grade)-GRADES.indexOf(y.grade))[0];S.chats[c.id].push({r:"sys",t:"✨ 결정적 순간"})}
  S.chats[c.id].push({r:"c",t:line,a:key?pick.name:null});
  const choose=!key&&b.turns%3===0;
  if(choose)S.chats[c.id].push({r:"choice",ms:choicePick(c.id),done:null});
  save();renderChat();
  if(key)playMotion(pick,{key:true,line});

}

  const st=o.step==null?`<button class="payopt lock" disabled><div><b><span class="dot s" style="display:inline-block"></span> 스텝으로</b><small>${o.stepLock||"스텝으로는 살 수 없어요"}</small></div><span class="amt">잠김</span></button>`:`<button class="payopt" data-act="pay" data-v="step"><div><b><span class="dot s" style="display:inline-block"></span> 스텝으로</b><small>보유 ${S.step}${S.step<o.step?" · 부족해요":""}</small></div><span class="amt" style="color:var(--step)">${o.step}</span></button>`;
  const jp=`<button class="payopt" data-act="pay" data-v="jump"><div><b><span class="dot j" style="display:inline-block"></span> 점프로</b><small>보유 ${S.jump}${S.jump<o.jump?" · 부족해요":""}</small></div><span class="amt" style="color:var(--jump)">${o.jump}</span></button>`;
  sheet(`<h3>어떤 재화로 살까요?</h3><p class="sub">${o.title} · ${o.desc}</p>${st}${jp}${o.extra||""}<button class="close" data-act="close">닫기</button>`);
}
function pay(cur){const o=PAY;if(!o)return;const amt=cur==="step"?o.step:o.jump;
  if(S[cur]<amt){closeSheet();toast(cur==="step"?"스텝이 모자라요. 출석이나 광고로 받을 수 있어요.":"점프가 모자라요. 충전 화면을 열게요.");if(cur==="jump")setTimeout(chargeSheet,300);return}
  S[cur]-=amt;save();closeSheet();PAY=null;o.onPay();render();
}
function buyMotion(cid,mid){const m=mBy(mid);const c=chById(cid);
  payChooser({title:`「${m.name}」 소장`,desc:`${c.name}에게 입혀요 · ${m.grade}등급 ${m.emo}`,step:stepLock(m)?null:stepPrice(m),stepLock:stepLock(m),jump:m.price,onPay:()=>{grant(cid,mid);save();toast(`${c.name}: “…이건 너한테만 보여 주는 거다.”`)}});
}
function buyPack(pid){const p=pBy(pid);const c=chById(p.ch);
  payChooser({title:`「${p.title}」`,desc:"장면 팩은 점프로만 살 수 있어요",step:null,stepLock:"장면 팩은 점프 전용이에요",jump:p.price,onPay:()=>{S.packs.push(p.id);p.motions.forEach(id=>grant(p.ch,id));save();toast(`「${p.title}」 소장 완료 · ${c.name}의 장면이 열렸어요`)}});
}
function buyBundle(cid){const c=chById(cid);const b=bundleInfo(c);
  payChooser({title:`${c.name} 시즌 번들`,desc:`남은 팩 ${b.left.length}개 · 15% 할인`,step:null,stepLock:"번들은 점프 전용이에요",jump:b.price,onPay:()=>{b.left.forEach(p=>{S.packs.push(p.id);p.motions.forEach(id=>grant(cid,id))});save();toast(`${c.name} 2026 겨울 시즌 전부 소장!`)}});
}
function openEp(id){const e=EPS.find(x=>x.id===id);const c=chById(e.ch);
  if(e.free||epUnlocked(id))return epSheet(c,e.title,e.text);
  payChooser({title:`특별 에피소드 「${e.title}」`,desc:c.name,step:e.step,stepLock:e.lock,jump:e.jump,onPay:()=>{S.eps.push(id);save();setTimeout(()=>epSheet(c,e.title,e.text),50)}});
}
function epSheet(c,t,text){sheet(`<div class="boxstage"><div class="figure" style="${bgi(c)};width:150px;height:184px;border-radius:18px;background-size:cover;background-position:center 15%"></div></div><h3 style="text-align:center">「${t}」</h3><p class="sub" style="text-align:center">${text}</p><button class="btn pri" style="width:100%" data-act="epgo" data-v="${c.id}" data-t="${esc(t)}">이 장면 들어가기</button><button class="close" data-act="close">닫기</button>`)}
function pkEp(pid){const p=pBy(pid);const c=chById(p.ch);
  if(S.packs.includes(pid))return epSheet(c,p.ep,p.epText);
  sheet(`<h3>${c.name}: “이 장면은… 아직 보여 줄 수 없어.”</h3><p class="sub">「${p.ep}」는 장면 팩 「${p.title}」에 들어 있어요.</p>${packCard(p)}<button class="close" data-act="close">닫기</button>`);
}
// ---------- charge / plus
function chargeSheet(){
  const att=S.attend===todayKey;if(S.stepAds.date!==todayKey)S.stepAds={date:todayKey,n:0};
  const opts=[[30,0,3000],[60,0,6000],[120,10,12000],[200,25,20000],[500,60,50000]];
  sheet(`<h3>스텝 받기 · 점프 충전</h3><p class="sub">스텝은 무료로 모으고, 점프는 충전해요. 1점프 = 100원.</p>
  <div class="wide" style="margin:0 0 16px"><button class="btn" data-act="attend" ${att?"disabled":""}>${att?"오늘 출석 완료":"출석 체크 · 스텝 +10"}</button><button class="btn" data-act="stepad" ${S.stepAds.n>=3?"disabled":""}>광고 보기 · 스텝 +5 (${3-S.stepAds.n}/3)</button></div>
  <div class="chg">${opts.map(([j,b,w])=>`<button data-act="buyjump" data-v="${j+b}"><b>점프 ${j}${b?` <em>+${b}</em>`:""}</b><span>${w.toLocaleString()}원</span></button>`).join("")}</div>
  <p class="sub" style="margin-top:12px">결제는 시연용이라 실제로 청구되지 않아요.</p><button class="close" data-act="close">닫기</button>`);
}
function plusSheet(){
  sheet(`<h3>moti PLUS</h3><p class="sub">월 13,000원 · 매월 점프 100 지급 (약 10,000원 가치)</p><div class="card"><p>광고 없음 · 고급 AI + 장기 기억<br>하루 무료 모션 보기 3회를 광고 없이</p></div>${S.plus?`<button class="btn" style="width:100%" data-act="unplus">구독 해지 (시연)</button>`:`<button class="btn gold" style="width:100%" data-act="doplus">구독 시작하고 점프 100 받기</button>`}<button class="close" data-act="close">닫기</button>`);
}
// ---------- box
function boxSheet(kind){const b=BOX[kind];const c=chById(U.fitChar);
  sheet(`<h3>${b.name}</h3><p class="sub">${c.name}에게 들어갈 모션을 뽑아요 · 점프 ${b.price} (보유 ${S.jump})</p><table class="ptable" style="color:var(--text)"><tr><th></th>${GRADES.map(g=>`<th style="color:var(--${g})">${g}</th>`).join("")}</tr><tr><td>확률</td>${b.p.map(p=>`<td>${p}%</td>`).join("")}</tr><tr><td>중복 시 스텝</td>${GRADES.map(g=>`<td>${REFUND[g]}</td>`).join("")}</tr></table><div class="boxstage" id="bst"><div class="giftbox" id="gb">🎁</div></div><button class="btn ${kind==="prem"?"gold":"pri"}" style="width:100%" data-act="openbox" data-v="${kind}">점프 ${b.price}로 열기</button><button class="close" data-act="close">닫기</button>`);
}
function openBox(kind){const b=BOX[kind];const c=chById(U.fitChar);
  if(S.jump<b.price){closeSheet();toast("점프가 모자라요. 충전 화면을 열게요.");return setTimeout(chargeSheet,300)}
  S.jump-=b.price;let r=Math.random()*100,gi=0;for(;gi<7;gi++){r-=b.p[gi];if(r<0)break}gi=Math.min(gi,6);
  const g=GRADES[gi];const pool=M.filter(m=>m.grade===g);const m=pool[Math.floor(Math.random()*pool.length)];
  const dup=owns(c.id,m.id);if(dup)S.step+=REFUND[g];else grant(c.id,m.id);save();render();
  $("#gb").classList.add("shake");
  setTimeout(()=>{$("#bst").innerHTML=`<div class="gcard" id="gc" style="--gc:var(--${g})"><div class="in"><div class="f"><b>?</b></div><div class="b"><span class="g">${g}</span><b>${m.name}</b><span>${m.emo} · ${dup?`이미 가진 모션 · 스텝 +${REFUND[g]}`:`${c.name}에게 들어갔어요`}</span></div></div></div>`;
    setTimeout(()=>$("#gc").classList.add("flip"),120);
    document.querySelector("[data-act=openbox]").outerHTML=`<div class="wide" style="margin-top:0"><button class="btn" data-act="box" data-v="${kind}">한 번 더</button><button class="btn pri" data-act="seefit" data-v="${m.id}">피팅룸에서 보기</button></div>`;
  },900);
}
// ---------- intro
function intro(cid){const c=chById(cid);
  if(has3D(cid)){$("#layer").innerHTML=`<div class="intro">${stage3dHtml(c,0,{mood:0},true)}<q>${c.intro}</q><div class="r"><button class="btn" data-act="replay">다시 보기</button><button class="btn pri" data-act="skipintro">건너뛰고 대화로</button></div></div>`;J3D.mount($("#i3d"),cid);J3D.play(mBy("m13"));return}
  $("#layer").innerHTML=`<div class="intro"><div class="figure" id="ifig" style="${bgi(c)}"></div><q>${c.intro}</q><div class="r"><button class="btn" data-act="replay">다시 보기</button><button class="btn pri" data-act="skipintro">건너뛰고 대화로</button></div></div>`;
  const m=mBy("m15");setTimeout(()=>playOn($("#ifig"),m),200);
}
// ---------- router
function render(){renderTop();renderNav();({home:renderHome,discover:renderDiscover,chat:renderChat,motion:renderMotion,my:renderMy})[U.tab]();mountFit()}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");if(!t)return;const a=t.dataset.act,v=t.dataset.v;
  if(a==="closeov"&&e.target!==t)return;
  switch(a){
    case"tab":closeSheet();U.tab=v;if(v==="chat"&&!U.chatChar){}render();scrollTo(0,0);break;
    case"seg":U.homeSeg=v;render();break;
    case"close":case"closeov":closeSheet();break;
    case"charge":chargeSheet();break;
    case"plus":plusSheet();break;
    case"doplus":S.plus=true;S.jump+=100;save();closeSheet();render();toast("PLUS 시작 · 점프 100 지급 (약 10,000원 가치)");break;
    case"unplus":S.plus=false;save();closeSheet();render();break;
    case"attend":S.attend=todayKey;S.step+=10;save();render();chargeSheet();toast("출석 완료 · 스텝 +10");break;
    case"stepad":S.stepAds.n++;S.step+=5;save();render();chargeSheet();toast("광고 시청 완료 · 스텝 +5");break;
    case"buyjump":S.jump+=+v;save();render();chargeSheet();toast(`점프 +${v} 충전 (시연)`);break;
    case"openchat":U.chatChar=v;U.tab="chat";render();if(!S.seen.includes(v)){S.seen.push(v);save();intro(v)}break;
    case"replay":if($("#i3d"))J3D.play(mBy("m13"));else playOn($("#ifig"),mBy("m15"));break;
    case"skipintro":closeSheet();if(U.tab==="chat")renderChat();break;
    case"chatback":U.chatChar=null;render();break;
    case"send":send();break;
    case"vmode":S.vmode=S.vmode==="chat"?"split":"chat";save();renderChat();toast(S.vmode==="chat"?"채팅만 보기 · 모션은 나올 때 전체 화면으로 보여요":"나눠 보기 · 위에 캐릭터, 아래 채팅");break;
    case"vset":S.vmode=v;save();renderChat();toast(v==="chat"?"채팅만 보기 · 모션은 나올 때 전체 화면으로 보여요":"나눠 보기 · 위에 캐릭터, 아래 채팅");break;
    case"fullclose":clearInterval(fullTimer);closeSheet();break;
    case"mmode":S.mmode[U.chatChar]=v;save();renderChat();toast(v==="key"?"중요한 순간에만 모션이 나와요":"대화마다 모션이 나와요");break;
    case"pickm":{const c=chById(U.chatChar);const msg=S.chats[c.id][+t.dataset.i];if(msg)msg.done=v;save();closeSheet();viewMotion(v);if($("#layer").innerHTML==="")renderChat();break}
    case"motionsheet":motionSheet();break;
    case"viewm":viewMotion(v);break;
    case"buymotion":buyMotion(t.dataset.c,v);break;
    case"reel":reel();break;
    case"savereel":{const c=chById(U.chatChar),b=bond(c.id),lv=Math.min(5,Math.floor(b.pts/4));S.reels.push({ch:c.id,name:c.name,lv:`인연 ${lv} — ${BONDL[lv]}`,mood:MOODS[b.mood],turns:b.turns,date:fmtMD(new Date())});save();closeSheet();toast("소장했어요 · 마이페이지 ‘우리의 서사’에 쌓였어요");break}
    case"restart":{const c=chById(U.chatChar);S.chats[c.id]=[{r:"c",t:c.intro,a:"웃음"}];S.bond[c.id]={pts:0,turns:0,mood:0};if(S.scene)S.scene[c.id]=0;save();render();toast("새 회차 시작");break}
    case"fitchar":U.fitChar=v;U.mk.ms=[];U.ck=[];render();break;
    case"fittab":U.fitTab=v;render();break;
    case"filter":U.filter=v;render();break;
    case"fitpacks":U.tab="motion";U.fitTab="pack";U.fitChar="jihu";render();break;
    case"try":{const m=mBy(v);fitPlay(m);if(!owns(U.fitChar,v))setTimeout(()=>buyMotion(U.fitChar,v),900);break}
    case"buypack":buyPack(v);break;
    case"buybundle":buyBundle(v);break;
    case"bundlesheet":sheet(bundleCard(chById(v))+`<button class="close" data-act="close">닫기</button>`);break;
    case"mkscene":U.mk.scene=v;render();break;
    case"mkadd":{const a=U.mk.ms,i=a.indexOf(v);if(i>=0)a.splice(i,1);else if(a.length<5)a.push(v);else toast("최대 5개까지 담을 수 있어요");render();break}
    case"mkprev":fitPlay(mBy(v));scrollTo({top:0,behavior:"smooth"});break;
    case"mkbuy":mkBuy();break;
    case"playpack":{const p=S.mypacks.find(x=>x.id===v);scrollTo({top:0,behavior:"smooth"});p.motions.forEach((id,k)=>setTimeout(()=>fitPlay(mBy(id)),k*1900));break}
    case"ckpick":{const i=U.ck.indexOf(v);i<0?U.ck.push(v):U.ck.splice(i,1);render();break}
    case"ckbuy":ckBuy(+v);break;
    case"hsort":U.hsort=v;render();break;
    case"htag":U.htag=v;render();break;
    case"box":if(U.tab!=="motion"){U.tab="motion";render()}boxSheet(v);break;
    case"openbox":openBox(v);break;
    case"seefit":closeSheet();U.tab="motion";U.fitTab="motion";U.filter="all";render();fitPlay(mBy(v));break;
    case"pay":pay(v);break;
    case"ep":openEp(v);break;
    case"pkep":pkEp(v);break;
    case"epgo":{closeSheet();U.chatChar=v;U.tab="chat";const c=chById(v);(S.chats[v]||(S.chats[v]=[])).push({r:"sys",t:`특별 에피소드 「${t.dataset.t}」`},{r:"c",t:c.lines[0],a:"다가가기"});save();render();break}
    case"dtag":U.dtag=v;render();break;
    case"dsub":U.dsub=v;render();scrollTo(0,0);break;
    case"gogoods":U.tab="discover";U.dsub="goods";render();scrollTo(0,0);break;
    case"like":{const i=S.likes.indexOf(v);i<0?S.likes.push(v):S.likes.splice(i,1);save();render();break}
    case"cmt":toast("댓글은 곧 열려요");break;
    case"feedtry":{const m=mByName(t.dataset.m);closeSheet();U.tab="motion";U.fitTab="motion";U.filter="all";U.fitChar=v;render();scrollTo(0,0);fitPlay(m);if(!owns(v,m.id))setTimeout(()=>buyMotion(v,m.id),900);break}
    case"share":shareSheet();break;
    case"pickreel":U.shareReel=+v;{const cap=$("#cap").value;shareSheet();$("#cap").value=cap}break;
    case"post":{const r=S.reels[U.shareReel];const cap=$("#cap").value.trim();if(!cap){toast("영업 문구를 한 줄 적어 주세요");break}
      const cid=r.ch||(CH.find(c=>c.name===r.name)||CH[0]).id;const om=M.filter(m=>owns(cid,m.id));
      S.posts.push({id:"u"+Date.now(),user:"나의 덕질 계정",col:"#8b5cf6",ch:cid,mo:om.slice().sort((a,b)=>GRADES.indexOf(a.grade)-GRADES.indexOf(b.grade))[0].name,text:cap,likes:0,cm:0,ago:"방금",kind:"릴스"});
      U.shareReel=null;save();closeSheet();U.tab="discover";U.dsub="feed";render();scrollTo(0,0);toast("영업 완료 · 피드 맨 위에 올라갔어요");break}
    case"good":goodSheet(v);break;
    case"order":{const g=gBy(v);const c=chById(g.ch);S.orders.push({id:v,date:fmtMD(new Date())});let msg="예약 주문 완료";
      if(g.perk){if(owns(c.id,g.perk)){S.step+=REFUND[mBy(g.perk).grade];msg+=` · 특전 모션 중복이라 스텝 +${REFUND[mBy(g.perk).grade]}`}else{grant(c.id,g.perk);msg+=` · ${c.name}에게 「${mBy(g.perk).name}」 지급`}}
      save();closeSheet();render();toast(msg);break}
    case"soon":toast(v==="자캐"?"하람: “잠깐, 머리 좀 정리하고!” · 자캐 만들기는 곧 열려요":"영업하러 가기는 곧 열려요");break;
    case"reset":if(confirm("지갑·소장·대화 기록을 처음 상태로 돌릴까요?")){S=blank();save();render()}break;
  }
});
setInterval(()=>{if(U.tab==="home"&&U.homeSeg==="home"&&!$("#layer").innerHTML){U.slide=(U.slide+1)%SLIDES.length;document.querySelectorAll(".banner .slide").forEach((s,i)=>s.classList.toggle("on",i===U.slide));const n=$(".banner .cnt");if(n)n.textContent=`${U.slide+1}/${SLIDES.length}`}},5000);
render();
</script>
</body>
</html>
